<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        --page-background: #f7f9fc;
        --splash-background: #ffffff;
        --splash-border: rgba(59, 130, 246, 0.14);
        --splash-shadow: rgba(15, 23, 42, 0.1);
        --spinner-track: rgba(15, 23, 42, 0.1);
        --spinner-color: #3b82f6;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page-background: #111827;
        --splash-background: #1f2937;
        --splash-border: rgba(96, 165, 250, 0.24);
        --splash-shadow: rgba(0, 0, 0, 0.3);
        --spinner-track: rgba(255, 255, 255, 0.14);
        --spinner-color: #60a5fa;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--page-background);
        user-select: none;
      }

      body {
        display: grid;
        place-items: center;
      }

      .splash {
        display: grid;
        width: 112px;
        height: 112px;
        place-items: center;
        align-content: center;
        gap: 8px;
        border: 1px solid var(--splash-border);
        border-radius: 0;
        background: var(--splash-background);
        box-shadow: 0 12px 30px var(--splash-shadow);
      }

      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid var(--spinner-track);
        border-top-color: var(--spinner-color);
        border-right-color: var(--spinner-color);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      .loading-text {
        color: var(--spinner-color);
        direction: rtl;
        font-size: 11px;
        line-height: 1;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" aria-label="Loading">
      <div class="spinner"></div>
      <div class="loading-text">جاري التحميل</div>
    </div>
    <script>
      const theme = new URLSearchParams(window.location.search).get("theme");
      document.documentElement.dataset.theme =
        theme === "dark" ? "dark" : "light";
    </script>
  </body>
</html>
